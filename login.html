<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PixelPlay · Iniciar Sesion</title>
  <!-- Carga de fuente Poppins (400,700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loginRegister.css" />

  
</head>
<body>
  <div class="frame">
    <main class="bg-scene" aria-label="Fondo decorativo">
      <!-- Botón 'Inicio' -->
      <a class="btn-inicio" href="index.html" role="button" aria-label="Ir al inicio">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Inicio
      </a>
      <!-- Fondo corte izquierdo -->
      <div class="left-bg" aria-hidden="true">
        <img class="plane" src="assets/imgIniciarSesion.png" alt="" aria-hidden="true" />
      </div>

      <!-- Frame inicio sesion-->
      <section class="right-slot" aria-label="Panel de inicio de sesión">
        <h2 class="card-title">
          <img class="icon" src="assets/logo.png" alt="" aria-hidden="true" />
          Iniciar sesión en PixelPlay
        </h2>
  <form class="auth-form" action="index.html" method="get" novalidate>
          <div class="field" id="email-field">
            <input id="email" type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" aria-describedby="email-error" aria-invalid="false" required />
            <p class="error-text" id="email-error" role="alert" aria-live="polite"></p>
          </div>
          <div class="field" id="password-field">
            <input id="password" type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" aria-describedby="password-error" aria-invalid="false" required />
            <button type="button" class="toggle-visibility" aria-label="Mostrar u ocultar contraseña" aria-pressed="false" data-visible="false">
              <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.59 21.59 0 0 1 5.06-5.94m4.25-2A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.59 21.59 0 0 1-3.22 3.88M1 1l22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <p class="error-text" id="password-error" role="alert" aria-live="polite"></p>
          </div>
          <a class="forgot-link" href="#">¿Has olvidado tu contraseña?</a>
          <button type="submit" class="btn-submit">Iniciar Sesión</button>
          <p class="continuar-text">O continuar con</p>
          <div class="social-auth">
            <a class="btn-social facebook" href="#" aria-label="Continuar con Facebook">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <!-- Ícono de Facebook (app mark) -->
                <path fill="currentColor" d="M22.675 0h-21.35C.597 0 0 .597 0 1.337v21.326C0 23.403.597 24 1.325 24H12.82v-9.294H9.692V11.09h3.128V8.414c0-3.1 1.894-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24h-1.918c-1.504 0-1.795.716-1.795 1.767v2.316h3.59l-.467 3.616h-3.123V24h6.127C23.403 24 24 23.403 24 22.663V1.337C24 .597 23.403 0 22.675 0z"/>
              </svg>
              <span>Facebook</span>
            </a>
            <a class="btn-social google" href="#" aria-label="Continuar con Google">
              <svg class="icon" viewBox="0 0 18 18" width="20" height="20" aria-hidden="true">
                <!-- Logo de Google (G común y simple) -->
                <path fill="#EA4335" d="M9 3.48c1.69 0 2.82.73 3.47 1.35l2.36-2.36C13.67.97 11.54 0 9 0 5.48 0 2.44 2.02 1 4.96l2.74 2.13C4.37 5.52 6.48 3.48 9 3.48z"/>
                <path fill="#4285F4" d="M17.64 9.2c0-.8-.07-1.39-.22-2H9v3.8h4.84c-.1.98-.62 2.45-1.78 3.44l2.72 2.11c1.58-1.46 2.86-3.74 2.86-7.35z"/>
                <path fill="#FBBC05" d="M3.73 10.99A5.52 5.52 0 0 1 3.45 9c0-.69.12-1.35.28-1.99L1 4.87A9.066 9.066 0 0 0 0 9c0 1.45.35 2.82.96 4.02l2.77-2.03z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.72-2.11c-.73.51-1.72.86-3.24.86a5.61 5.61 0 0 1-5.3-3.59L.96 13.02C2.39 15.98 5.45 18 9 18z"/>
              </svg>
              <span>Google</span>
            </a>
          </div>
          <p class="signup-hint">¿No tienes cuenta? <a class="signup-link" href="register.html">Registrate</a></p>
        </form>
      </section>
      <!-- Texto legal inferior derecho (fuera del formulario) -->
      <p class="legal">Al crear tu cuenta aceptas nuestras <a href="#">Condiciones de uso</a> y la <a href="#">Política de privacidad</a>.</p>
    </main>
  </div>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
