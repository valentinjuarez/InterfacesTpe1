<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlay · Registrarse </title>
     <!-- Carga de fuente Poppins (400,700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="frame">
    <main class="bg-scene" aria-label="Fondo decorativo">
      <!-- Botón 'Atrás' en la esquina superior izquierda -->
      <a class="btn-inicio" href="#" role="button" aria-label="Volver">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Atrás
      </a>
      <!-- Fondo con gradiente y recorte diagonal en el lado derecho -->
      <div class="right-bg" aria-hidden="true">
        <img class="plane" src="assets/imgIniciarSesion.png" alt="" aria-hidden="true" />
      </div>
      <!-- Frame izquierdo con gradiente (contenedor) -->
      <section class="left-slot" aria-label="Panel de registro">
        <h2 class="card-title">
          <img class="icon" src="assets/logo.png" alt="" aria-hidden="true" />
          Crea tu cuenta en PixelPlay
        </h2>
        <form class="auth-form" action="#" method="post" novalidate>
          <!-- Paso 1: Email y Username -->
          <div class="step step-1 is-active" data-step="1">
            <div class="field" id="reg-email-field">
              <label for="email">Email <span aria-hidden="true">*</span></label>
              <input id="email" type="email" name="email" placeholder="Email" autocomplete="email" aria-describedby="email-error" aria-invalid="false" required />
              <p class="error-text" id="email-error" role="alert" aria-live="polite"></p>
            </div>
            <div class="field" id="reg-username-field">
              <label for="reg-username">Username</label>
              <input id="reg-username" type="text" name="username" placeholder="Username" autocomplete="username" />
            </div>
          </div>

          <!-- Paso 2: Datos personales -->
          <div class="step step-2" data-step="2" hidden>
            <div class="field" id="first-name-field">
              <label for="first-name">Nombre <span aria-hidden="true"></span></label>
              <input id="first-name" type="text" name="firstName" placeholder="Nombre" aria-invalid="false" />
            </div>
            <div class="field" id="last-name-field">
              <label for="last-name">Apellido <span aria-hidden="true"></span></label>
              <input id="last-name" type="text" name="lastName" placeholder="Apellido" aria-invalid="false" />
            </div>
            <div class="field" id="age-field">
              <label for="age">Edad <span aria-hidden="true">*</span></label>
              <input id="age" type="number" name="age" placeholder="Edad" min="1" step="1" aria-describedby="age-error" aria-invalid="false" required />
              <p class="error-text" id="age-error" role="alert" aria-live="polite"></p>
            </div>
          </div>

          <!-- Paso 3: Crear contraseña y captcha (solo HTML/CSS) -->
          <div class="step step-3" data-step="3" hidden>
            <div class="field" id="reg-password-field">
              <label for="reg-password">Contraseña <span aria-hidden="true">*</span></label>
              <input id="reg-password" type="password" name="password" placeholder="Contraseña" aria-invalid="false" aria-describedby="reg-password-error" />
              <button type="button" class="toggle-visibility" aria-pressed="false" aria-label="Mostrar contraseña">
                <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="18" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.78 21.78 0 0 1 5.11-6.11M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.82 21.82 0 0 1-4.87 6.14M1 1l22 22" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              </button>
              <p class="error-text" id="reg-password-error" role="alert" aria-live="polite"></p>
            </div>

            <div class="field" id="reg-password2-field">
              <label for="reg-password2">Repetir la contraseña <span aria-hidden="true">*</span></label>
              <input id="reg-password2" type="password" name="password2" placeholder="Contraseña" aria-invalid="false" aria-describedby="reg-password2-error" />
              <button type="button" class="toggle-visibility" aria-pressed="false" aria-label="Mostrar contraseña">
                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.78 21.78 0 0 1 5.11-6.11M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.82 21.82 0 0 1-4.87 6.14M1 1l22 22" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              </button>
              <p class="error-text" id="reg-password2-error" role="alert" aria-live="polite"></p>
            </div>
            <!-- Captcha tipo reCAPTCHA (markup estático) -->
            <div class="captcha-box" role="group" aria-label="Verificación captcha">
              <label class="captcha-left" for="captcha-check">
                <input id="captcha-check" type="checkbox" name="captcha" />
                <span>No soy un robot</span>
              </label>
              <div class="captcha-right" aria-hidden="true">
                <div class="captcha-logo" title="reCAPTCHA"></div>
                <div class="captcha-meta">
                  <div class="captcha-brand">reCAPTCHA</div>
                  <div class="captcha-links"><a href="#">Privacidad</a> · <a href="#">Condiciones</a></div>
                </div>
              </div>
            </div>
          </div>

          <button type="button" class="btn-submit">Siguiente</button>
          <p class="signup-hint">¿Ya tienes cuenta? <a class="forgot-link" href="login.html">Inicia sesión.</a></p>
        </form>
        <!-- Progreso del registro -->
        <div class="progress" aria-label="Progreso del registro">
          <div class="progress-status" aria-live="polite"><strong>1 de 3</strong></div>
          <div class="progress-bar" role="progressbar" aria-label="Paso actual" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33">
            <span class="progress-fill step-1"></span>
          </div>
        </div>
        <!-- Overlay de éxito -->
        <div class="register-success" aria-live="polite" aria-hidden="true">
          <div class="success-card" role="status">
            <div class="success-check" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </div>
            <div class="success-text">Registro completado</div>
            <p><a class="forgot-link" href="login.html">Inicia sesión.</a></p>
          </div>
        </div>
      </section>
    </main>
  </div>
      <script type="module" src="js/pages/register.js"></script>
</body>
</html>
